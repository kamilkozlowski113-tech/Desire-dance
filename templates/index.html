<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Znajdź Partnera do Tańca</title>
    <!-- Bootstrap CSS dla ładnego wyglądu -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h2 class="mb-4 text-center">💃 Znajdź Partnera do Tańca 🕺</h2>

        <!-- Formularz filtrowania -->
        <form method="GET" action="/" class="row g-3 mb-5 bg-white p-4 rounded shadow-sm">
            <div class="col-md-5">
                <label class="form-label">Styl tańca</label>
                <select name="style" class="form-select">
                    <option value="">Wszystkie style</option>
                    <option value="Bachata" {% if selected_style == 'Bachata' %}selected{% endif %}>Bachata</option>
                    <option value="Salsa" {% if selected_style == 'Salsa' %}selected{% endif %}>Salsa</option>
                </select>
            </div>
            <div class="col-md-5">
                <label class="form-label">Dzień</label>
                <input type="text" name="day" class="form-control" value="{{ selected_day }}" placeholder="np. Czwartek">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-danger w-100">Filtruj</button>
            </div>
        </form>

        <!-- Lista profili -->
        <div class="row">
            {% for p in profiles %}
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="card-title">{{ p.name }}, {{ p.age }} lat</h5>
                            <p class="card-text">
                                <strong>Styl:</strong> {{ p.style }}<br>
                                <strong>Dzień:</strong> {{ p.day }}<br>
                                <strong>Poziom:</strong> {{ p.level }}<br>
                                <strong>Rola:</strong> {{ p.role }}
                            </p>
                        </div>
                        <div>
                            <a href="tel:{{ p.phone }}" class="btn btn-outline-danger btn-sm w-100 mb-2">Zadzwoń / Kontakt</a>
                            <!-- Przycisk usuwania ogłoszenia -->
                            <form action="/delete/{{ p.id }}" method="POST">
                                <button type="submit" class="btn btn-danger btn-sm w-100" style="background-color: #ff4d4d; border: none;">Usuń ogłoszenie</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Formularz dodawania profilu -->
        <hr class="my-5">
        <div class="bg-white p-4 rounded shadow-sm">
            <h4>Dodaj swój profil</h4>
            <form action="/add" method="POST" class="row g-3 mt-2">
                <div class="col-md-6">
                    <input type="text" name="name" class="form-control" placeholder="Imię" required>
                </div>
                <div class="col-md-6">
                    <input type="number" name="age" class="form-control" placeholder="Wiek" required>
                </div>
                <div class="col-md-4">
                    <select name="style" class="form-select">
                        <option value="Bachata">Bachata</option>
                        <option value="Salsa">Salsa</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <input type="text" name="day" class="form-control" placeholder="Dzień (np. Czwartek)" required>
                </div>
                <div class="col-md-4">
                    <select name="level" class="form-select">
                        <option value="Początkujący">Początkujący</option>
                        <option value="Średniozaawansowany">Średniozaawansowany</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <select name="role" class="form-select">
                        <option value="Leader">Leader</option>
                        <option value="Follower">Follower</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <input type="text" name="phone" class="form-control" placeholder="Numer telefonu" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success w-100">Dodaj ogłoszenie</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
