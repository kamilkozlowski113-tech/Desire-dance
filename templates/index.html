<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Szukam Partnera - Desire Dance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">🕺 Znajdź Partnera do Tańca 💃</h2>

        <!-- Formularz wyszukiwania / filtrów -->
        <form method="get" class="row g-3 mb-4 bg-white p-4 rounded shadow-sm">
            <div class="col-md-5">
                <label class="form-label">Styl tańca</label>
                <select name="style" class="form-select">
                    <option value="">Wszystkie style</option>
                    <option value="Bachata">Bachata</option>
                    <option value="Salsa">Salsa</option>
                </select>
            </div>
            <div class="col-md-5">
                <label class="form-label">Dzień</label>
                <select name="day" class="form-select">
                    <option value="">Wszystkie dni</option>
                    <option value="Czwartek">Czwartek</option>
                    <option value="Wtorek">Wtorek</option>
                </select>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-danger w-100">Filtruj</button>
            </div>
        </form>

        <!-- Lista profili -->
        <div class="row">
            {% for p in profiles %}
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">{{ p.name }}, {{ p.age }} lat</h5>
                        <p class="card-text">
                            <strong>Styl:</strong> {{ p.style }}<br>
                            <strong>Dzień:</strong> {{ p.day }}<br>
                            <strong>Poziom:</strong> {{ p.level }}<br>
                            <strong>Rola:</strong> {{ p.role }}
                        </p>
                        <a href="tel:{{ p.phone }}" class="btn btn-outline-danger btn-sm">Zadzwoń / Kontakt</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <!-- Formularz dodawania profilu -->
        <hr class="my-5">
        <div class="bg-white p-4 rounded shadow-sm">
            <h4>Dodaj swój profil</h4>
            <form action="/add" method="post" class="row g-3 mt-2">
                <div class="col-md-6"><input type="text" name="name" class="form-control" placeholder="Imię" required></div>
                <div class="col-md-6"><input type="number" name="age" class="form-control" placeholder="Wiek" required></div>
                <div class="col-md-4">
                    <select name="style" class="form-select">
                        <option value="Bachata">Bachata</option>
                        <option value="Salsa">Salsa</option>
                    </select>
                </div>
                <div class="col-md-4"><input type="text" name="day" class="form-control" placeholder="Dzień (np. Czwartek)" required></div>
                <div class="col-md-4">
                    <select name="level" class="form-select">
                        <option value="Początkujący">Początkujący</option>
                        <option value="Średniozaawansowany">Średniozaawansowany</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <select name="role" class="form-select">
                        <option value="Leader">Leader</option>
                        <option value="Follower">Follower</option>
                    </select>
                </div>
                <div class="col-md-6"><input type="text" name="phone" class="form-control" placeholder="Numer telefonu" required></div>
                <div class="col-12"><button type="submit" class="btn btn-dark">Opublikuj ogłoszenie</button></div>
            </form>
        </div>
    </div>
</body>
</html>
